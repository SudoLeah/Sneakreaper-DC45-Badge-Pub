<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0b12">
  <title>PCB Light Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#080910;
      --panel:rgba(24,26,39,.78);
      --panel2:rgba(32,35,51,.72);
      --line:rgba(255,255,255,.10);
      --text:#f7f7fb;
      --muted:#9fa5b8;
      --accent:#a624ff;
      --accent2:#ff3ea5;
      --glow:rgba(166,36,255,.38);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{
      min-height:100vh;margin:0;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 8% 0%,rgba(166,36,255,.21),transparent 34%),
        radial-gradient(circle at 100% 8%,rgba(255,62,165,.13),transparent 30%),
        linear-gradient(145deg,#080910,#0e101a 58%,#090a11);
    }
    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
      background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:34px 34px;
      mask-image:linear-gradient(to bottom,black,transparent 85%);
    }
    button,input{font:inherit}
    button{color:inherit}
    .wrap{width:min(1120px,100%);margin:auto;padding:22px 16px 46px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 2px 22px}
    .brand{display:flex;align-items:center;gap:13px}
    .logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),var(--accent2));box-shadow:0 10px 32px var(--glow);font-weight:900;letter-spacing:-1px}
    h1{font-size:clamp(1.25rem,4vw,1.85rem);line-height:1.1;margin:0;letter-spacing:-.03em}
    .subtitle{color:var(--muted);font-size:.82rem;margin-top:5px}
    .header-actions{display:flex;align-items:center;gap:9px}
    .nav-link{display:flex;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.22);font-size:.78rem;color:#c9cedd;text-decoration:none;white-space:nowrap;transition:.2s ease}
    .nav-link:hover{border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.07);color:white}
    .status{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.22);font-size:.78rem;color:#c9cedd;white-space:nowrap;transition:border-color .2s ease,background .2s ease,color .2s ease}
    .dot{width:8px;height:8px;border-radius:50%;background:#f5b942;box-shadow:0 0 14px #f5b942;transition:background .2s ease,box-shadow .2s ease}
    .status.connected{border-color:rgba(67,226,141,.28);background:rgba(67,226,141,.08);color:#d8f9e7}
    .status.connected .dot{background:#43e28d;box-shadow:0 0 14px #43e28d}
    .status.disconnected{border-color:rgba(255,82,104,.30);background:rgba(255,82,104,.08);color:#ffd9df}
    .status.disconnected .dot{background:#ff5268;box-shadow:0 0 14px #ff5268}
    .status.checking .dot{animation:statusPulse 1s ease-in-out infinite}
    @keyframes statusPulse{50%{opacity:.35;transform:scale(.78)}}
    .grid{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(330px,.96fr);gap:18px;align-items:start}
    .card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,var(--panel),rgba(13,14,23,.88));box-shadow:0 18px 60px rgba(0,0,0,.28);backdrop-filter:blur(18px)}
    .card-pad{padding:22px}
    .card h2{font-size:.83rem;text-transform:uppercase;letter-spacing:.14em;color:#bdc2d2;margin:0 0 17px}
    .preview{min-height:218px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,var(--glow),transparent 57%);border-bottom:1px solid var(--line)}
    .orb{width:138px;height:138px;border-radius:50%;position:relative;background:rgb(166,36,255);box-shadow:0 0 36px var(--glow),0 0 100px var(--glow);transition:background .12s,box-shadow .12s,opacity .12s}
    .orb:after{content:"";position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.8),rgba(255,255,255,.12) 18%,transparent 48%)}
    .preview-label{position:absolute;margin-top:185px;color:var(--muted);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase}
    .pattern-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .pattern{min-height:72px;border:1px solid var(--line);border-radius:16px;background:var(--panel2);padding:10px 6px;cursor:pointer;transition:.16s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:.72rem;color:#c6cad7}
    .pattern:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.22)}
    .pattern.active{background:linear-gradient(145deg,rgba(166,36,255,.31),rgba(255,62,165,.13));border-color:rgba(192,91,255,.68);box-shadow:0 8px 24px rgba(166,36,255,.16);color:white}
    .ico{font-size:1.25rem;line-height:1}
    .wheel-layout{display:grid;grid-template-columns:minmax(190px,245px) 1fr;gap:22px;align-items:center}
    .wheel-wrap{position:relative;aspect-ratio:1;width:100%;max-width:245px;margin:auto;touch-action:none;filter:drop-shadow(0 12px 30px rgba(0,0,0,.38))}
    #wheel{display:block;width:100%;height:100%;border-radius:50%;cursor:crosshair}
    #marker{position:absolute;width:20px;height:20px;border:3px solid white;border-radius:50%;box-shadow:0 1px 8px #000;transform:translate(-50%,-50%);pointer-events:none}
    .color-info{display:flex;flex-direction:column;gap:12px}
    .hex-row{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center}
    .swatch{width:48px;height:48px;border-radius:14px;background:#a624ff;border:1px solid rgba(255,255,255,.2);box-shadow:0 7px 22px var(--glow)}
    .hex{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.22);color:white;padding:0 13px;text-transform:uppercase;outline:none}
    .hex:focus{border-color:rgba(192,91,255,.7)}
    .preset-row{display:flex;gap:8px;flex-wrap:wrap}
    .preset{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.22);cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
    .control{margin-top:17px}
    .control-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;color:#d8dbe5;font-size:.82rem}
    .value{color:var(--muted);font-variant-numeric:tabular-nums}
    input[type=range]{appearance:none;width:100%;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--accent) var(--fill,50%),rgba(255,255,255,.10) var(--fill,50%));outline:none}
    input[type=range]::-webkit-slider-thumb{appearance:none;width:20px;height:20px;border-radius:50%;background:white;border:3px solid var(--accent);box-shadow:0 2px 9px rgba(0,0,0,.45)}
    input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:white;border:3px solid var(--accent)}
    .rgb{display:grid;grid-template-columns:18px 1fr 35px;gap:9px;align-items:center;margin-top:10px;font-size:.78rem}
    .rgb output{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
    #r{--accent:#ff4e68}#g{--accent:#48df8a}#b{--accent:#5f88ff}
    .section-gap{margin-top:18px}
    .footer-note{text-align:center;color:#777d91;font-size:.72rem;margin-top:18px}
    .toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,18px);opacity:0;padding:10px 14px;border-radius:999px;background:#171a26;border:1px solid var(--line);box-shadow:0 10px 30px #000;color:#dfe3ec;font-size:.78rem;pointer-events:none;transition:.2s ease}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.wheel-layout{grid-template-columns:minmax(180px,240px) 1fr}.preview{min-height:190px}.orb{width:118px;height:118px}.preview-label{margin-top:160px}}
    @media(max-width:560px){.wrap{padding:14px 12px 36px}header{align-items:flex-start}.header-actions{flex-direction:column-reverse;align-items:flex-end}.nav-link,.status{padding:8px 10px;font-size:.7rem}.card-pad{padding:18px}.pattern-grid{grid-template-columns:repeat(4,1fr);gap:7px}.pattern{min-height:66px;font-size:.66rem}.wheel-layout{grid-template-columns:1fr}.wheel-wrap{max-width:230px}.color-info{margin-top:2px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">LED</div>
        <div><h1>PCB Light Studio</h1><div class="subtitle">ESP32-S3 local lighting control</div></div>
      </div>
      <div class="header-actions">
        <a class="nav-link" href="/">← Dashboard</a>
        <div id="connectionStatus" class="status checking" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span><span id="connectionText">Checking...</span>
        </div>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <div class="preview">
          <div id="orb" class="orb"></div>
          <div id="previewLabel" class="preview-label">Purple Wave</div>
        </div>
        <div class="card-pad">
          <h2>Patterns</h2>
          <div class="pattern-grid" id="patterns">
            <button class="pattern" data-pattern="solid"><span class="ico">●</span>Solid</button>
            <button class="pattern" data-pattern="rainbow"><span class="ico">◒</span>Rainbow</button>
            <button class="pattern" data-pattern="chase"><span class="ico">➜</span>Chase</button>
            <button class="pattern" data-pattern="pulse"><span class="ico">◎</span>Pulse</button>
            <button class="pattern" data-pattern="twinkle"><span class="ico">✦</span>Twinkle</button>
            <button class="pattern" data-pattern="theater"><span class="ico">⋯</span>Theater</button>
            <button class="pattern active" data-pattern="aurora"><span class="ico">≈</span>Purple Wave</button>
            <button class="pattern" data-pattern="off"><span class="ico">◌</span>Off</button>
          </div>

          <div class="section-gap">
            <h2>Animation</h2>
            <div class="control">
              <div class="control-head"><span>Brightness</span><span id="brightnessValue" class="value">63%</span></div>
              <input id="brightness" type="range" min="0" max="255" value="160">
            </div>
            <div class="control">
              <div class="control-head"><span>Speed</span><span id="speedValue" class="value">55%</span></div>
              <input id="speed" type="range" min="1" max="100" value="55">
            </div>
          </div>
        </div>
      </section>

      <section class="card card-pad">
        <h2>Color wheel</h2>
        <div class="wheel-layout">
          <div id="wheelWrap" class="wheel-wrap">
            <canvas id="wheel" width="500" height="500"></canvas>
            <div id="marker"></div>
          </div>
          <div class="color-info">
            <div class="hex-row"><div id="swatch" class="swatch"></div><input id="hex" class="hex" maxlength="7" value="#A624FF" aria-label="Hex color"></div>
            <div class="preset-row">
              <button class="preset" data-color="#FF315C" style="background:#ff315c" aria-label="Red"></button>
              <button class="preset" data-color="#FF8A1F" style="background:#ff8a1f" aria-label="Orange"></button>
              <button class="preset" data-color="#FFE347" style="background:#ffe347" aria-label="Yellow"></button>
              <button class="preset" data-color="#42E58B" style="background:#42e58b" aria-label="Green"></button>
              <button class="preset" data-color="#24C7FF" style="background:#24c7ff" aria-label="Cyan"></button>
              <button class="preset" data-color="#5078FF" style="background:#5078ff" aria-label="Blue"></button>
              <button class="preset" data-color="#A624FF" style="background:#a624ff" aria-label="Purple"></button>
              <button class="preset" data-color="#FF3EA5" style="background:#ff3ea5" aria-label="Pink"></button>
              <button class="preset" data-color="#FFFFFF" style="background:#fff" aria-label="White"></button>
            </div>
          </div>
        </div>

        <div class="section-gap">
          <h2>Color sliders</h2>
          <div class="control">
            <div class="control-head"><span>Hue</span><span id="hueValue" class="value">274°</span></div>
            <input id="hue" type="range" min="0" max="360" value="274">
          </div>
          <div class="rgb"><b>R</b><input id="r" type="range" min="0" max="255" value="166"><output id="rValue">166</output></div>
          <div class="rgb"><b>G</b><input id="g" type="range" min="0" max="255" value="36"><output id="gValue">36</output></div>
          <div class="rgb"><b>B</b><input id="b" type="range" min="0" max="255" value="255"><output id="bValue">255</output></div>
        </div>
      </section>
    </main>
    <div class="footer-note">Controls are sent directly to the ESP32 over its local Wi-Fi network.</div>
  </div>
  <div id="toast" class="toast">Settings updated</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const state = {pattern:'aurora',r:166,g:36,b:255,brightness:160,speed:55};
  let sendTimer = 0, toastTimer = 0, wheelImage;
  let connectionCheckActive = false;

  const names = {solid:'Solid',rainbow:'Rainbow',chase:'Chase',pulse:'Pulse',twinkle:'Twinkle',theater:'Theater',aurora:'Purple Wave',off:'Off'};
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const hex2 = n => Math.round(n).toString(16).padStart(2,'0').toUpperCase();
  const rgbHex = (r,g,b) => `#${hex2(r)}${hex2(g)}${hex2(b)}`;
  const parseHex = s => {
    const m = /^#?([0-9a-f]{6})$/i.exec(s.trim());
    if(!m) return null;
    const n = parseInt(m[1],16);
    return {r:n>>16,g:(n>>8)&255,b:n&255};
  };

  function hsv2rgb(h,s,v){
    h=((h%360)+360)%360; const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c; let r=0,g=0,b=0;
    if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
    return {r:Math.round((r+m)*255),g:Math.round((g+m)*255),b:Math.round((b+m)*255)};
  }
  function rgb2hsv(r,g,b){
    r/=255;g/=255;b/=255; const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min; let h=0;
    if(d){if(max===r)h=60*(((g-b)/d)%6);else if(max===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}
    if(h<0)h+=360; return {h,s:max===0?0:d/max,v:max};
  }
  function setRangeFill(el){const p=(el.value-el.min)/(el.max-el.min)*100;el.style.setProperty('--fill',`${p}%`)}
  function toast(msg='Settings updated'){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1100)}

  function setConnectionStatus(status){
    const badge=$('#connectionStatus'),text=$('#connectionText');
    badge.classList.remove('connected','disconnected','checking');
    badge.classList.add(status);
    text.textContent=status==='connected'?'Connected':status==='disconnected'?'Disconnected':'Checking...';
  }

  async function fetchWithTimeout(url,options={},timeoutMs=2200){
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),timeoutMs);
    try{return await fetch(url,{...options,signal:controller.signal})}
    finally{clearTimeout(timeout)}
  }

  async function checkConnection(syncState=false){
    if(connectionCheckActive)return false;
    connectionCheckActive=true;
    try{
      const res=await fetchWithTimeout('/api/state?_='+Date.now(),{cache:'no-store'});
      if(!res.ok)throw new Error('ESP32 did not respond');
      const nextState=await res.json();
      if(!nextState||typeof nextState!=='object')throw new Error('Invalid state response');
      setConnectionStatus('connected');
      if(syncState){Object.assign(state,nextState);updateUI()}
      return true;
    }catch(e){
      setConnectionStatus('disconnected');
      return false;
    }finally{
      connectionCheckActive=false;
    }
  }

  function drawWheel(){
    const c=$('#wheel'),ctx=c.getContext('2d'),w=c.width,h=c.height,cx=w/2,cy=h/2,rad=w/2-2,img=ctx.createImageData(w,h);
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const dx=x-cx,dy=y-cy,d=Math.sqrt(dx*dx+dy*dy),i=(y*w+x)*4;
      if(d<=rad){const hue=(Math.atan2(dy,dx)*180/Math.PI+360)%360,sat=d/rad,rgb=hsv2rgb(hue,sat,1);img.data[i]=rgb.r;img.data[i+1]=rgb.g;img.data[i+2]=rgb.b;img.data[i+3]=255}
    }
    ctx.putImageData(img,0,0);wheelImage=img;
  }
  function placeMarker(){
    const hsv=rgb2hsv(state.r,state.g,state.b),wrap=$('#wheelWrap'),r=wrap.clientWidth/2*.94,a=hsv.h*Math.PI/180,d=hsv.s*r;
    $('#marker').style.left=`${wrap.clientWidth/2+Math.cos(a)*d}px`;$('#marker').style.top=`${wrap.clientHeight/2+Math.sin(a)*d}px`;
  }
  function chooseFromWheel(e){
    const rect=$('#wheel').getBoundingClientRect(),cx=rect.width/2,cy=rect.height/2,dx=e.clientX-rect.left-cx,dy=e.clientY-rect.top-cy,rad=rect.width/2;
    const d=Math.min(Math.sqrt(dx*dx+dy*dy),rad),h=(Math.atan2(dy,dx)*180/Math.PI+360)%360,s=d/rad,rgb=hsv2rgb(h,s,1);
    setColor(rgb.r,rgb.g,rgb.b,true);
  }

  function updateUI(){
    const hex=rgbHex(state.r,state.g,state.b),hsv=rgb2hsv(state.r,state.g,state.b),off=state.pattern==='off';
    document.documentElement.style.setProperty('--accent',hex);
    document.documentElement.style.setProperty('--glow',`rgba(${state.r},${state.g},${state.b},.38)`);
    $('#swatch').style.background=hex;$('#hex').value=hex;
    $('#orb').style.background=hex;$('#orb').style.opacity=off?'0.13':Math.max(.14,state.brightness/255);
    $('#orb').style.boxShadow=off?'none':`0 0 36px rgba(${state.r},${state.g},${state.b},.38),0 0 100px rgba(${state.r},${state.g},${state.b},.30)`;
    $('#previewLabel').textContent=names[state.pattern]||state.pattern;
    ['r','g','b'].forEach(k=>{$('#'+k).value=state[k];$('#'+k+'Value').value=state[k];setRangeFill($('#'+k))});
    $('#hue').value=Math.round(hsv.h);$('#hueValue').textContent=Math.round(hsv.h)+'°';setRangeFill($('#hue'));
    $('#brightness').value=state.brightness;$('#brightnessValue').textContent=Math.round(state.brightness/255*100)+'%';setRangeFill($('#brightness'));
    $('#speed').value=state.speed;$('#speedValue').textContent=state.speed+'%';setRangeFill($('#speed'));
    $$('.pattern').forEach(b=>b.classList.toggle('active',b.dataset.pattern===state.pattern));
    placeMarker();
  }
  function setColor(r,g,b,send=true){state.r=clamp(Math.round(r),0,255);state.g=clamp(Math.round(g),0,255);state.b=clamp(Math.round(b),0,255);updateUI();if(send)scheduleSend()}
  function scheduleSend(){clearTimeout(sendTimer);sendTimer=setTimeout(sendState,65)}
  async function sendState(){
    const q=new URLSearchParams(state);
    try{
      const res=await fetchWithTimeout('/api/set?'+q,{cache:'no-store'});
      if(!res.ok)throw new Error('ESP32 did not accept settings');
      setConnectionStatus('connected');
      toast();
    }catch(e){
      setConnectionStatus('disconnected');
      toast('Connection interrupted');
    }
  }
  async function loadState(){
    const connected=await checkConnection(true);
    if(!connected)updateUI();
  }

  $$('.pattern').forEach(b=>b.addEventListener('click',()=>{state.pattern=b.dataset.pattern;updateUI();scheduleSend()}));
  $$('.preset').forEach(b=>b.addEventListener('click',()=>{const c=parseHex(b.dataset.color);setColor(c.r,c.g,c.b)}));
  $('#hex').addEventListener('change',e=>{const c=parseHex(e.target.value);if(c)setColor(c.r,c.g,c.b);else updateUI()});
  ['r','g','b'].forEach(k=>$('#'+k).addEventListener('input',()=>setColor(+$('#r').value,+$('#g').value,+$('#b').value)));
  $('#hue').addEventListener('input',e=>{const hsv=rgb2hsv(state.r,state.g,state.b),rgb=hsv2rgb(+e.target.value,hsv.s||1,hsv.v||1);setColor(rgb.r,rgb.g,rgb.b)});
  $('#brightness').addEventListener('input',e=>{state.brightness=+e.target.value;updateUI();scheduleSend()});
  $('#speed').addEventListener('input',e=>{state.speed=+e.target.value;updateUI();scheduleSend()});
  const wheel=$('#wheel');wheel.addEventListener('pointerdown',e=>{wheel.setPointerCapture(e.pointerId);chooseFromWheel(e)});wheel.addEventListener('pointermove',e=>{if(e.buttons)chooseFromWheel(e)});
  window.addEventListener('resize',placeMarker);

  drawWheel();
  loadState();
  setInterval(()=>checkConnection(false),3000);
  window.addEventListener('focus',()=>checkConnection(false));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkConnection(false)});
})();
</script>
</body>
</html>
