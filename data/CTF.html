<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffffff;
      color: #111111;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
    }

    .top-nav {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 22px;
    }

    .dashboard-link {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid #c7c7c7;
      border-radius: 999px;
      background: #f5f5f5;
      color: #111111;
      font-weight: 700;
      text-decoration: none;
    }

    .dashboard-link:hover {
      background: #e9e9e9;
      border-color: #999999;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 24px auto;
    }
  </style>
</head>
<body>
  <main>
    <nav class="top-nav" aria-label="Page navigation">
      <a class="dashboard-link" href="/">← Dashboard</a>
    </nav>
    <img src="/ctf-image.png" alt="CTF image">
  </main>
</body>
</html>
